Name: Convert HTML to EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP Project
        run: |
          Expand-Archive -Path ./*.zip -DestinationPath ./ExtractedProject

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Nativefier
        run: npm install -g nativefier

      - name: Build EXE from HTML
        run: |
          # سيقوم هذا الأمر بتحويل صفحة index.html الموجودة في مشروعك إلى تطبيق ويندوز exe
          nativefier --name "ProToolsHub" --icon "ExtractedProject/icon.ico" "./ExtractedProject/" "./AppOutput/" --overwrite --tray

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Executable-App
          path: ./AppOutput/
